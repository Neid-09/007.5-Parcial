<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Formulario de Nacimiento</title>
  </head>

  <body>
    <div class="container">
      <h1>Informacion de usuario</h1>
      <form class="form-user" id="form-user" action="index2.html" method="POST">
        <!-- Datos usuario nacimiento -->
        <label for="name">Nombre:</label>
        <input
          type="text"
          id="name"
          name="name"
          placeholder="Ingrese su nombre"
          required
        />

        <label for="year">Año de Nacimiento:</label>
        <input
          type="number"
          id="year"
          name="year"
          placeholder="Ingrese su año de nacimiento"
          required
        />

        <label for="month">Mes de Nacimiento:</label>
        <input
          type="number"
          id="month"
          name="month"
          min="1"
          max="12"
          placeholder="Ingrese su mes de nacimiento"
          required
        />

        <label for="hour">Hora de Nacimiento:</label>
        <input
          type="number"
          id="hour"
          name="hour"
          min="0"
          max="23"
          placeholder="Ingrese su hora de nacimiento"
          required
        />

        <label for="minute">Minuto de Nacimiento:</label>
        <input
          type="number"
          id="minute"
          name="minute"
          min="0"
          max="59"
          placeholder="Ingrese su minuto de nacimiento"
          required
        />

        <label for="second">Segundo de Nacimiento:</label>
        <input
          type="number"
          id="second"
          name="second"
          min="0"
          max="59"
          placeholder="Ingrese su segundo de nacimiento"
          required
        />

        <input type="submit" value="Enviar" />
      </form>
    </div>
  </body>
  <script src="script.js"></script>
</html>

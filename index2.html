<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Calculo edad</title>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Informacion de usuario</h1>
            <p id="current-date"></p>
        </div>
        <div class="result-user" id="result-user">
            <!-- Datos usuario nacimiento -->
            <div class="user-info-section">
                <h3>Información Personal</h3>
                <p id="name-user"></p>
                <p id="date-user"></p>
                <p id="time-user"></p>
            </div>
            
            <div class="age-info-section">
                <h3>Edad Actual</h3>
                <p id="age-user"></p>
                <p id="exact-age"></p>
            </div>
        </div>
        <button id="btn-return" class="btn-return">Volver</button>
    </div>
</body>
<script src="script2.js"></script>
</html>
